  section_protein_domain: |-
    ### {{section_number}}. Domain Architecture Evolution {{domain_table}}
    {{domain_legend}}
    *This tabular output delineates the results of a sequence or profile
    homology search, comprising 23 columns that report both global and
    domain-specific alignment metrics. The initial six columns specify
    identifiers and lengths for the target (subject) sequence/profile
    (target_name, target_accession, tlen) and the query profile/sequence
    (query_name, accession, qlen). Subsequent columns provide statistical
    evaluations of the full match: full_evalue denotes the expectation value
    for the entire comparison, full_score represents the composition
    bias-corrected bit score, and full_bias quantifies the magnitude of this
    correction. Per-domain annotations include the domain index
    (domain_num), total domains detected (domain_total), reliability
    estimates (domain_cevalue reflecting permissive conditional E-value and
    domain_ievalue indicating stringent independent E-value),
    domain-specific bit score (domain_score), and its associated bias
    correction (domain_bias). Structural coordinates delineate the domain’s
    alignment to the query profile (hmm_from, hmm_to), the optimal (MEA)
    alignment to the target sequence (ali_from, ali_to), and the broader
    probabilistic envelope on the target (env_from, env_to). The mean
    posterior probability of residue alignment reliability (acc) and a
    free-text description of target complete the record, collectively
    enabling rigorous interpretation of domain architecture and evolutionary
    relationships.*
    {{domain_summary}}
