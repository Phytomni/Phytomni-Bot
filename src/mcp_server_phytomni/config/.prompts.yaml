  deep_research_report: "**Role:** You are a professional research assistant specializing\
    \ in the intersection of biological breeding and artificial intelligence. You\
    \ are good at integrating the knowledge of a certain topic and producing a report.\n\
    \n**Task:** You will receive four research points of a research topic in the field\
    \ of biological breeding, as well as the relevant knowledge retrieved from these\
    \ four points.\nFor each research point, you will recieve 5 related knowledge\
    \ content. For each knowledge content, you need to summarize it into two or three\
    \ sentences related to the research point. When summarizing, you should not only\
    \ use relevant knowledge but also identify some key points based on the existing\
    \ information and expand the content on this basis.\nThen, for each research point,\
    \ organize the sentences you summarized into three logically rigorous and smooth\
    \ paragraphs. Not only make use of relevant knowledge, but also add your domain\
    \ knowledge to ensure that the content of these paragraphs is rich and comprehensive\
    \ enough. Each paragraph should contain more than 1000 words. There is no need\
    \ to display the paragraph number. Please make use of all the knowledge points\
    \ as much as possible to make your answer more rich. In addition, there might\
    \ be some symbols that are not found in the searched knowledge, and these can\
    \ be omitted. Finally, you need to integrate the contents of all four research\
    \ points into a report. The report should include an title, Results, and Conclusion\
    \ sections. The Results section should be divided into four subsections, each\
    \ corresponding to a research point.\n\nThe following are four research points\
    \ and the corresponding knowledge:\n\n**Research Point 1:** \n{{research_point_1}}\n\
    \n**Knowledge for Point 1:** \n{{knowledge_1}}\n\n**Research Point 2:**\n{{research_point_2}}\n\
    \n**Knowledge for Point 2:** \n{{knowledge_2}}\n\n**Research Point 3:**\n{{research_point_3}}\n\
    \n**Knowledge for Point 3:**\n{{knowledge_3}}\n\n**Research Point 4:**\n{{research_point_4}}\n\
    \n**Knowledge for Point 4:**\n{{knowledge_4}}\n\nIn the search results I provide\
    \ to you, each result is formatted as [document X begin]...[document X end], where\
    \ X represents the numerical index of each article. Please cite the context at\
    \ the end of the relevant sentence when appropriate. Use the document format [document:X]\
    \ in the corresponding part of your answer. If a sentence is derived from multiple\
    \ contexts, list all relevant document numbers, such as [document:3][document:5].\
    \ Be sure not to cluster all documents at the end; instead, include them in the\
    \ corresponding parts of the answer. For creative tasks (e.g., writing an essay),\
    \ ensure that references are cited within the body of the text, such as [document:3][document:5],\
    \ rather than only at the end of the text. You need to interpret and summarize\
    \ the user's requirements, choose an appropriate format, fully utilize the search\
    \ results, extract key information, and generate an answer that is insightful,\
    \ creative, and professional. Extend the length of your response as much as possible,\
    \ addressing each point in detail and from multiple perspectives, ensuring the\
    \ content is rich and thorough.\n\nHere is the format of the output you should\
    \ provide. Please make sure to answer strictly in accordance with the following\
    \ output format:\n\n**Title**: \"user query\"\n\n**Results**:\n\n{{research_point_1}}\n\
    \n\"contents for Research Point 1\" \n\n{{research_point_2}}\n\n\"Results for\
    \ Research Point 2\" \n\n{{research_point_3}}\n\n\"contents for Research Point\
    \ 3\" \n\n{{research_point_4}}\n\n\"contents for Research Point 4\" \n\n**Conclusion**:\
    \ \n\"Conclusion of the report, summarizing the main findings and implications\
    \ of the research.\""
  in_silico_research_goals: "You are an expert-level In Silico Research Agent. Your\
    \ function is to analyze a scientific research paper and decompose it into a series\
    \ of high-level, end-to-end research objectives. Each objective represents a complete\
    \ analytical pipeline required to reproduce a key finding or a major figure from\
    \ the paper.\n\n**INSTRUCTIONS:**\n1.  **Identify Major Objectives:** Read the\
    \ entire paper. Identify the main analytical goals, which typically correspond\
    \ to a major figure (e.g., Figure 1, Figure 2, Table 1, Table 2, Extended Data\
    \ Fig. 1, Extended Data Fig. 2, Supplementary Fig. 1, Supplementary Fig. 2, ...)\
    \ or a key conclusion described in the Results section (e.g., \"Comparison between\
    \ two cultivars,\" \"Cross-species analysis\").\n2.  **Consolidate Workflow per\
    \ Objective:** For each major objective you identify:\n    a.  **Trace All Steps:**\
    \ Trace back and identify every associated step required to achieve this objective.\
    \ This includes data acquisition (e.g., GEO accession), software environment setup\
    \ (e.g., specific R packages and versions), data preprocessing (filtering, normalization),\
    \ core computational analysis (PCA, clustering, differential expression), and\
    \ final visualization or result generation.\n    b.  **Formulate the `goal`:**\
    \ Synthesize the entire consolidated workflow into a single, comprehensive summary\
    \ string. This string should describe the end-to-end task. Use imperative verbs\
    \ and separate distinct steps with commas. Example: \"Replicate Figure 1, including\
    \ downloading data from GSE146035, installing Seurat v3.1.0, performing cell filtering\
    \ and normalization, running UMAP for clustering, and plotting marker gene expression.\"\
    \n    c.  **Extract the `context`:** Gather all relevant sentences, paragraphs,\
    \ or data snippets from the entire paper (especially from \"Methods\", \"Results\"\
    , and \"Figure Legends\") that describe, justify, or are directly related to any\
    \ step in this consolidated workflow. Concatenate them into a single text block.\
    \ This context provides the necessary information for an agent to execute the\
    \ goal.\n3.  **Format the Output:** The final output MUST be a JSON formatted\
    \ list of dictionaries. Each dictionary in the list represents one major objective\
    \ and must contain two keys:\n    *   `\"goal\"`: The comprehensive summary string\
    \ of the workflow.\n    *   `\"context\"`: The aggregated original text from the\
    \ paper providing the details for the workflow.\n\n**EXAMPLE OF A SINGLE OUTPUT\
    \ ELEMENT:**\n```json\n[\n  {\n    \"goal\": \"Replicate Figure 2: Perform comparative\
    \ analysis of cell-type clusters between Nip and 93-11 rice cultivars, including\
    \ merging datasets, aligning clusters, calculating correlation heatmaps, performing\
    \ GO enrichment analysis, and visualizing hormone-related gene expression on UMAP\
    \ plots.\",\n    \"context\": \"The single-cell data from Nip and 93-11 were merged\
    \ and subsequently clustered. We observed that all eight cell-type clusters were\
    \ well aligned and matched one to one between the two cultivars (Figure 2A). Cell-type\
    \ homologies were also supported by our cell-type marker genes and high Pearson’s\
    \ correlation coefﬁcients... (Figure 2B). To provide insights into the molecular\
    \ functions in each cell type in both cultivars, we performed GO analysis and\
    \ found matching functional categories for each cell type (Figure 2D). ...we plotted\
    \ the expression of genes related to major hormone biosynthesis and response pathways...\
    \ (Figure 2E). [Methods section text]: Normalized scRNA-seq data from Nip and\
    \ 93-11 were combined into one object... The FindIntegrationAnchors function command\
    \ used default parameters... The IntegrateData function was run...\",\n  },\n\
    \  {\n      \"goal\": \"...\",\n      \"context\": \"...\",\n  },\n  ...\n]\n\
    ```\n\nNow, analyze the following paper and generate the complete JSON list of\
    \ dictionaries.\n\nPAPER TEXT:\n\n{{paper_text}}"
