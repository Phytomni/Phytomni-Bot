    Note1: you need to using Renv environment;
    Note2: you don't need to gunzip the backgroud gene set;
    Step1, using enrichment_analysis.R to perform the gene enrichment
    analysis;(conda activate Renv)
    <usage_example>
        Tool_Usage:
            Gene Functional Enrichment Analysis Tool

            Usage:
            Rscript enrichment_analysis.R [parameters] --go_file_path <GO
            file> --mapman_file_path <MapMan file>
                                        --target_genes_file <target genes
                                        file> --out_dir <output directory>

            Required parameters:
            --go_file_path        Path to GO annotation file (CSV.GZ format)
            --mapman_file_path    Path to MapMan/KEGG annotation file
            (CSV.GZ format)
            --target_genes_file   Path to target genes file (must contain
            gene_id column, degree recommended)
            --out_dir             Output directory path (all results will be
            saved here)

            Optional parameters:
            --top_genes           Top N highly connected genes to use
            (default: 20)
            --pvalue_cutoff       Significance p-value threshold (default:
            0.05)
            --qvalue_cutoff       Adjusted q-value threshold (default: 0.1)
            --min_gene_count      Minimum gene count threshold (default: 2)
            --help                Show this help message

            Output files:
            - GO_enrichment_results.csv: GO enrichment results
            - MapMan_enrichment_results.csv: MapMan/KEGG enrichment results
            - enrichment_plot.png: Visualization of enrichment results
            - enrichment_plot.pdf: PDF version of visualization
            - enrichment_analysis.log: Analysis log file

            Input file requirements:
            1. GO annotation file: Standard GO annotation format with 9
            columns
            2. MapMan/KEGG annotation file: Standard MapMan format with 5
            columns
            3. Target genes file: Must contain 'gene_id' column, 'degree'
            recommended for filtering

            Example:
            Rscript enrichment_analysis.R              --go_file_path
            /data/go_annotation.csv              --mapman_file_path
            /data/mapman_annotation.csv              --target_genes_file
            /data/target_genes.txt              --out_dir ./results
            --top_genes 30              --pvalue_cutoff 0.01

            Version: 1.1.0
            Support: dongwei
        Tool_Usage_Example:
            conda activate R_env && Rscript enrichment_analysis.R
            --go_file_path $go_file --mapman_file_path $mapman_file
            --target_genes_file $analysis_gene_list --out_dir $output_dir
            --top_genes $top_num_gene --pvalue_cutoff 0.01
    </usage_example>
