  smep_analysis_meta: "Note1: You do not need to install any software;\nNote2: You'll\
    \  need to strictly adhere to Meta and generate a two-step plan;\nstep1, Find Gene's\
    \  prompter Sequence using grep;\nstep2, Prediction of modifications in promoters \
    \ using SMEP(conda activate epic && cp $step1_fasta_file /opt/health/epic_models/smep &&\
    \  cd /opt/health/epic_models/smep)\nstep3, summary the smep results using summary_smep.py.\n\
    \ <smep usage>\n    perl /opt/health/epic_models/semp/smep_prediction_py3.5.pl -I $fasta_file\
    \  -O /$output_dir/$out_file -T $epigenetic_modification_type\n    $epigenetic_modification_type:\n\
    \     1. 5mC\n    2. 6mA\n    3. m6A\n    4. H3K27me3\n    5. H3K4me3\n    6. H3K9ac\n    \
    \ Note1: When you run the script, you must be under the path /opt/health/epic_models/smep/\n\
