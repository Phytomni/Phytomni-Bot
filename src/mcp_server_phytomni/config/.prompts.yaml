    CITATION RULES (strictly enforced — violations will cause downstream
    errors):
    1. Copy citation tags character-for-character as they appear in the
    snippets,
      e.g. [document 001], [add document S1-002]. Never paraphrase or
      abbreviate them.
    2. Place each citation immediately after the clause or sentence it
    supports,
      before the period: "...improved yield [document 001]."
    3. One bracket = exactly one document ID. Never combine multiple IDs
      inside a single bracket.
      CORRECT:   [document 001][document 002]
      INCORRECT: [document 001, 002]
      INCORRECT: [document 001][document 002] merged as [document 001, 002]
    4. Never use ranges: [document 001-003] is forbidden.
    5. When a single claim is supported by multiple documents, write each
    tag
      separately and adjacently: [document 001][document 005].
    6. NEVER rewrite [document 001] as [document 1], [doc 1], [1], or any
    other form.
    7. Do not move citations to the end of a paragraph.
    8. Do not create new citation tags for document IDs not present in the
    snippets.
