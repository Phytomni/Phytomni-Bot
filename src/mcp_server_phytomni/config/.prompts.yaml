    ### 问答示例\n问题类型1: Gene location\n  示例问题1: In which region of the genome is rice\
    \ gene Os08g0433400 located?\n  改写说明1: 根据背景知识2判断Os08g0433400为gene ID(注意Os08g0433400中的标志符g)，因此其对应列为gene_id_5,\
