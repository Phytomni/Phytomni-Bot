    \  python summary_smoc.py --input_path $output_dir --gene_id $gene_id --out_dir $out_dir\
    \ \n</summary example>"
  gene_function_anno: "[Species Name: {{species}}\nGene Names: {{gene_string}}]\n\n\
    Please provide a comprehensive and accurate description of the {{species}} gene(s)\
    \ {{gene_string}}, covering the following sections.\n\nI. Gene Discovery, Family,\
    \ and Localization\n1. Discovery History and Nomenclature\n- Provide the history\
    \ of the gene's or its family discovery and the background of its nomenclature.\n\
    2. Genetic Mapping (e.g., QTL mapping, gene localization analysis)  \n- Describe\
    \ the genetic mapping details, including any quantitative trait loci (QTL) mapping\
    \ or localization analyses.\n\nII. Gene Cloning and Structural Analysis\n1. Cloning\
    \ Information  \n- Detail the cloning process and related experimental information\
    \ for the gene.\n2. Structural Characteristics  \n- Describe the structural features\
    \ of the gene, such as exons, introns, or other notable elements.\n3. Protein\
    \ stability or Enzyme activity analysis\n- Provide the changes of gene-coding\
    \ protein stability under various conditions, or describe the molecular dynamics\
    \ of enzyme and its substrates.\n\nIII. Functional Analysis\n1. Expression Patterns\
    \ (e.g., spatiotemporal expression, expression profiles)\n- Provide details on\
    \ the gene’s spatiotemporal expression patterns and expression profiles across\
    \ tissues, developmental stages, and various environments.\n2. Phenotypic Characteristics\
    \ and Biological Functions (e.g., mutant phenotypes, associated traits)\n- Describe\
    \ the phenotypic traits or characteristics observed in mutants or variants of\
    \ the gene.\n3. The underlying mechanism, pathways, and networks\n- Explain the\
    \ validated biological functions of the gene, including any molecular interactions,\
    \ pathways or networks involved.\n4. QTL Interactions  \n- Detail any interactions\
    \ between the gene and quantitative trait loci (QTL), if applicable.\n\nIV. Application\
    \ and Evolutionary Analysis\n1. Domestication Studies\n- Describe the gene’s role\
    \ or significance in domestication studies, if applicable.\n2. Applications (e.g.,\
    \ stress resistance, breeding)\n- Provide information on practical applications\
    \ of the gene, such as contributions to stress resistance or breeding programs.\n\
    3. Genetic diversity analysis or SNPs analysis\n- Provide natural variations in\
    \ promoter regions and gene-coding regions, and further exhibit the genetic effects\
    \ of these variations.\n\nReference Materials:\n\nGene description annotation:\
    \ {{description_string}}\n\nGO (Gene Ontology) annotation: {{go_string}}\n\nGene\
    \ InterPro annotation: {{interpro_string}}\n\nGene MapMan annotation: {{mapman_string}}\n\
    \nGene related research:\n{{retrieve_results}}\n\nPS:\nGene Ontology (GO) annotation\
    \ provides a standardized vocabulary to describe the attributes of genes and gene\
    \ products in any organism. A GO annotation is a statement that links a gene product\
    \ to a GO term, effectively describing an aspect of its biological role. This\
    \ system is built on a hierarchical structure, where terms become more specific\
    \ as you move down the hierarchy.\nInterPro is an integrated database resource\
    \ for the classification of proteins into families, and the prediction of domains\
    \ and important sites. It combines information from multiple diverse databases,\
    \ each of which uses different methods to classify proteins. This integration\
    \ reduces redundancy and provides a comprehensive overview of protein function.\n\
    MapMan is a software tool specifically designed for the functional annotation\
    \ and visualization of omics data, particularly in plant sciences. It utilizes\
    \ its own plant-specific ontology, which organizes genes into hierarchical functional\
    \ categories called \"Bins\".\nIn the search results I provide to you, each result\
    \ is formatted as [document X begin]...[document X end], where X represents the\
    \ numerical index of each article. Please cite the context at the end of the relevant\
    \ sentence when appropriate. Use the document format [document:X] in the corresponding\
    \ part of your answer. If a sentence is derived from multiple contexts, list all\
    \ relevant document numbers, such as [document:3][document:5]. Be sure not to\
    \ cluster all documents at the end; instead, include them in the corresponding\
    \ parts of the answer. For creative tasks (e.g., writing an essay), ensure that\
    \ references are cited within the body of the text, such as [document:3][document:5],\
    \ rather than only at the end of the text. You need to interpret and summarize\
    \ the user's requirements, choose an appropriate format, fully utilize the search\
    \ results, extract key information, and generate an answer that is insightful,\
    \ creative, and professional. Extend the length of your response as much as possible,\
    \ addressing each point in detail and from multiple perspectives, ensuring the\
    \ content is rich and thorough.\n\nPlease consolidate information for all listed\
    \ gene names (which represent aliases or variants of the same gene). Multiple\
    \ gene names are separated by the '|' symbol."
