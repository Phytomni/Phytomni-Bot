  gene_function: "[Species Name: {{species}}\nGene Names: {{gene_string}}]\n\nPlease\
    \ provide a comprehensive and accurate description of the {{species}} gene(s)\
    \ {{gene_string}}, covering the following sections. Ensure all information is\
    \ derived from the reference materials below, which include published scientific\
    \ literature, reputable databases (e.g., PubMed, GenBank, Ensembl), or validated\
    \ research findings. If no relevant information is available for a section, explicitly\
    \ state \"No relevant information available\" rather than speculating or generating\
    \ unverified content.\n\nI. Gene Discovery, Family, and Localization\n1. Discovery\
    \ History and Nomenclature\n- Provide the history of the gene's or its family\
    \ discovery and the background of its nomenclature.\n2. Genetic Mapping (e.g.,\
    \ QTL mapping, gene localization analysis)  \n- Describe the genetic mapping details,\
