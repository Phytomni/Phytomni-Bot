    step2, Sequence alignment using diamond blastp to find top40 sequence to
    target species if target taxid is not all, using -t 16 paramter and
    --tmpdir $tmp paramter(conda install diamond -c bioconda);
    step3, Extract the sequence ids from the blast result using awk;
    step4, Extract the matched sequences from the database using seqkit(conda
    install seqkit -c bioconda);
    step5, Append protein sequences of unknown function to the end of the
    matched sequences file;
    step6, Multiple sequence alignment using clustalw2(conda install clustalw
    -c bioconda);
    step7, Constructing the phylogenetic tree using fasttree(conda install
    fasttree -c bioconda);
    step8, Plot the phylogenetic tree using plot_tree.py;
