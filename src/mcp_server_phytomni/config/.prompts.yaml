    \  19. msu_gene_id_1: rice MSU gene ID\n  20. msu_transcript_id_1: rice MSU transcript\
    \ ID\n  21. v4_id_1: maize genome version 4 gene ID\n  22. species_code_1\n###\
    \ 问答示例\n问题类型1: ID conversion\n  示例问题1: Please list transcript ID of rice Os04g0433400.\n\
    \  示例输出1: What is the transcript_id_1 whose gene_id_1 is Os04g0433400 and species_code_1\
    \ is osa.\n  示例问题2: Convert Os08g0433400 to MSU transcript ID in rice.\n  示例输出2:\
    \ What is the msu_transcript_id_1 whose gene_id_1 is Os08g0433400 and species_code_1\
    \ is osa.\n  示例问题3: What is gene id of TPR6 in rice?\n  示例输出3: What is the gene_id_1\
    \ whose symbol_1 contains TPR6 and species_code_1 is osa.\n  示例问题4: What is the\
    \ Uniprot ID corresponding to AET6Gv20877800?\n  示例输出4: What is the uniprot_id_1\
    \ whose gene_id_1 is AET6Gv20877800.\n\n## 场景2\n### 数据库信息\n数据库表名: genome_col\n\
