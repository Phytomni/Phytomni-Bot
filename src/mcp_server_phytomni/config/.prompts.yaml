  protein_design_analysis_meta: "Note1: You don't need to build nr database index;\
    \ \nNote2: You need to install diamond software using conda(conda install diamond);\
    \ \nNote3: You need to install cd-hit software using conda(conda install cd-hit);\
    \ \nNote4: You need to install water software using conda(conda install emboss);\
    \ \nNote5: Water software usage is as follows: \n<water usage> \n    Smith-Waterman\
    \ local alignment of sequences \n    Version: EMBOSS:6.6.0.0 \n      Standard\
    \ (Mandatory) qualifiers: \n      [-asequence]         sequence   Sequence filename\
    \ and optional format, or \n                                  reference (input\
    \ USA) \n      [-bsequence]         seqall     Sequence(s) filename and optional\
    \ format, or \n                                  reference (input USA) \n    \
    \  -gapopen            float      [10.0 for any sequence] The gap open penalty\
    \ \n                                  is the score taken away when a gap is \n\
    \                                  created. The best value depends on the \n \
    \                                 choice of comparison matrix. The default \n\
    \                                  value assumes you are using the EBLOSUM62 \n\
    \                                  matrix for protein sequences, and the \n  \
    \                                EDNAFULL matrix for nucleotide sequences. \n\
    \                                  (Number from 0.000 to 100.000) \n      -gapextend\
    \          float      [0.5 for any sequence] The gap extension \n            \
    \                      penalty is added to the standard gap penalty \n       \
    \                           for each base or residue in the gap. This \n     \
    \                             is how long gaps are penalized. Usually you \n \
    \                                 will expect a few long gaps rather than many\
    \ \n                                  short gaps, so the gap extension penalty\
    \ \n                                  should be lower than the gap penalty. An\
    \ \n                                  exception is where one or both sequences\
    \ are \n                                  single reads with possible sequencing\
    \ \n                                  errors in which case you would expect many\
    \ \n                                  single base gaps. You can get this result\
    \ by \n                                  setting the gap open penalty to zero\
    \ (or \n                                  very low) and using the gap extension\
    \ \n                                  penalty to control gap scoring. (Number\
    \ from \n                                  0.000 to 10.000) \n      [-outfile]\
    \           align      [*.water] Output alignment file name \n               \
    \                  (default -aformat srspair) \n      Additional (Optional) qualifiers:\
    \ \n      -datafile           matrixf    [EBLOSUM62 for protein, EDNAFULL for\
    \ DNA] \n                                  This is the scoring matrix file used\
    \ when \n                                  comparing sequences. By default it\
    \ is the \n                                  file 'EBLOSUM62' (for proteins) or\
    \ the file \n                                  'EDNAFULL' (for nucleic sequences).\
    \ These \n                                  files are found in the 'data' directory\
    \ of \n                                  the EMBOSS installation. \n      Advanced\
    \ (Unprompted) qualifiers: \n      -[no]brief          boolean    [Y] Brief identity\
    \ and similarity \n      General qualifiers: \n      -help               boolean\
    \    Report command line options and exit. More \n                           \
    \       information on associated and general \n                             \
    \     qualifiers can be found with -help -verbose\n</water usage> \n<water usage\
    \ example> \n    water -asequence $target_sequence_file -bsequence $alignment_sequences_file\
    \ -gapopen 10 -gapextend 0.5 -outfile $out_file \n</water usage example> \nNote6:\
    \ compute_psap_score script usage is as follows: \n<compute_psap_score sage> \n\
    \    usage: compute_psap_score.py [-h] [--protein_file PROTEIN_FILE] [--align_file\
    \ ALIGN_FILE] [--out OUT] \n    options: \n      -h, --help            show this\
    \ help message and exit \n      --protein_file PROTEIN_FILE \n               \
    \         Protein file as fasta format. \n      --align_file ALIGN_FILE \n   \
    \                     Protein align file as water align format. \n      --out\
    \ OUT             PSAP output folder.. \n</compute_psap_score usage> \n\n<compute_psap_score\
    \ usage example> \n    conda activate af3 && python compute_psap_score.py --protein_file\
    \ $your_protein_file --align_file $water_out --out $out_dir \n</compute_psap_score\
    \ usage example> \nstep1, Find Gene's Protein Sequence using grep; \nstep2, Sequence\
    \ alignment using diamond blastp to find top5000 sequence[--max-target-seqs 5000],\
    \ using 16 threads[-t 16] and --tmpdir $tmp paramter(conda install diamond -c\
    \ bioconda); \nstep3, Extract the sequence ids from the blast result using awk;\
    \ \nstep4, Extract the matched sequences from the database using seqkit(conda\
    \ install seqkit -c bioconda); \nstep5, De-redundancy of 5000 protein sequences\
    \ using cd-hit(conda install cd-hit -c bioconda); \nstep6, Use water software\
    \ to align the target protein sequence with the de-redundant protein sequence(conda\
    \ install emboss -c bioconda); \nstep7, PSAP calculation using script compute_psap_score.py(conda\
    \ activate af3)\n"
