    - Goal: Produce a text block starting with an introductory paragraph,
    followed by exactly n numbered paragraphs that align protocols to
    analyses with precise figure citations.

    - Step 1: Drafting the Introduction
      - Generate a single, high-level introductory paragraph (≈30-50 words)
      explaining the overall rationale for conducting the subsequent
      experiments (e.g., to provide empirical validation for the preceding
      analytical results).

    - Step 2: Input parsing and mapping
      - Extract n protocol titles and descriptions from `protocol_sections`;
      preserve order.
      - Parse `analysis_sections` to identify analysis themes/topics and
      exact figure identifier strings (e.g., “Fig. 2”, “Figure 5”).
      - Build a relevance map using topic/keyword overlap and semantic
      similarity between protocol aims and analysis themes; prioritize
