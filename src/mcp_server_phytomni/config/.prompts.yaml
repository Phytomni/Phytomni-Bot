    \ pep?\n\n## 场景3\n### 数据库信息\n数据库表名: genotype_col\n表结构及列含义:\n  1. chromosome_3\n\
    \  2. position_3\n  3. variant_id_3\n  4. ref_allele_3\n  5. alt_allele_3\n  6.\
    \ info_3\n  7. species_code_3\n### 问答示例\n问题类型1: Variant information extraction\n\
