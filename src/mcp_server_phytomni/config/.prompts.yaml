    \  --output $out_dir --threshold 0.8 --window_size 800 \n    $model_type: \n\
    \     1. Best_model_9311CK.h5: Wild-type chromatin accessibility of variety 9311\n\
    \     2. Best_model_9311HS.h5: Chromatin accessibility in the heat-excited state of variety 9311\n\
    \     3. Best_model_NIPCK.h5: Wild-type chromatin accessibility of variety NIP\n\
    \     4. Best_model_NIPHS.h5: Chromatin accessibility in the heat-excited state of variety NIP\n\
    \ </smoc usage>\n<smep example>\n    question: please help me to predict the wild-type\
