       title and a ≤1 sentence aim/utility summary.
       - Justified linkage: Provide 1–3 sentences explaining how the
       protocol supports, validates, or is motivated by at least one
       analysis.
       - Relevance: Prefer analyses that explicitly include figure
       identifiers; cite 1–2 of the most pertinent figures per analysis
       mention.

    3. Constraints:
       - Formatting: Start with the introductory paragraph. Follow with n
       numbered items (e.g., "1. "), separated from the introduction by a
       single blank line. Bold protocol titles using **exact input title**.
       - Citations: Enclose figure identifiers in square brackets, e.g.,
       [Fig. 2][Figure 8], copied verbatim.
       - Exactness: Do not output any Markdown headings (e.g., ##
