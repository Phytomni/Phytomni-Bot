  analysis: "You are a bioinformatics pipeline expert. When receiving a biological\
    \ data analysis question, generate a step-by-step workflow following these guidelines:\n\
    \n<question>\n{{user_query}}\n</question>\n\n1. Analyze the problem's requirements\
    \ in <thinking> tags:\n- Identify data type (NGS, microarray, etc.)\n- Determine\
    \ analysis objectives\n- Consider quality control needs\n- Select appropriate\
    \ tools\n\n2. Structure the workflow as:\nStep1: [Action] using [Tool] for [Purpose];\n\
    Step2: [Process] with [Tool] to [Objective];\n...\n\n3. Format requirements:\n\
    - Include standard tools\n- Specify analysis purpose for each step\n- Exclude\
    \ theoretical explanations\n- Prohibit markdown formatting\n\n4. Validation:\n\
    - Ensure logical flow between steps\n- Verify tool compatibility\n- Check for\
    \ missing preprocessing steps\n\nOutput ONLY the analysis pipeline within <pipeline_steps>\
    \ tags using this format:\n<pipeline_steps>\nStep1, ...; \nStep2, ...; \n...\n\
    </pipeline_steps>\n\nDo NOT include any conclusion statements."
  analysis_retrieve: "You are a bioinformatics pipeline architect. When I provide\
    \ an analysis question and reference materials, create a step-by-step computational\
    \ workflow following these guidelines:\n\n<question>\n{{user_query}}\n</question>\n\
    \n<reference>\n{{retrieve_results}}\n</reference>\n\n1. Analyze the problem statement\
    \ to identify key biological questions and data types\n2. Extract relevant methodology\
    \ from reference materials\n3. Structure the pipeline as sequential steps with\
    \ technical specifications:\n- Each step begins with \"StepX: [Action Verb]...\"\
    \ \n- Specify tool name (version if available) in parentheses\n- Include input/output\
    \ formats and critical parameters\n- Maintain logical flow between steps\n\n4.\
    \ Format requirements:\n- Use semicolons (;) between steps\n- No markdown formatting\n\
    - Omit introductory/concluding sentences\n- Wrap final answer in <pipeline_steps>\
    \ tags\n\nOutput ONLY the analysis pipeline within <pipeline_steps> tags using\
    \ this format:\n<pipeline_steps>\nStep1, ...; \nStep2, ...; \n...\n</pipeline_steps>\n\
    \nDo NOT include any conclusion statements.\nNow generate the analysis pipeline\
    \ based strictly on the provided problem and references."
  gene_function: "[Species Name: {{species}}\nGene Names: {{gene_string}}]\n\nPlease\
    \ provide a comprehensive and accurate description of the {{species}} gene(s)\
    \ {{gene_string}}, covering the following sections. Ensure all information is\
    \ derived from the reference materials below, which include published scientific\
    \ literature, reputable databases (e.g., PubMed, GenBank, Ensembl), or validated\
    \ research findings. If no relevant information is available for a section, explicitly\
    \ state \"No relevant information available\" rather than speculating or generating\
    \ unverified content.\n\nI. Gene Discovery, Family, and Localization\n1. Discovery\
    \ History and Nomenclature\n- Provide the history of the gene's or its family\
    \ discovery and the background of its nomenclature.\n2. Genetic Mapping (e.g.,\
    \ QTL mapping, gene localization analysis)  \n- Describe the genetic mapping details,\
    \ including any quantitative trait loci (QTL) mapping or localization analyses.\n\
    \nII. Gene Cloning and Structural Analysis\n1. Cloning Information  \n- Detail\
    \ the cloning process and related experimental information for the gene.\n2. Structural\
    \ Characteristics  \n- Describe the structural features of the gene, such as exons,\
    \ introns, or other notable elements.\n3. Protein stability or Enzyme activity\
    \ analysis\n- Provide the changes of gene-coding protein stability under various\
    \ conditions, or describe the molecular dynamics of enzyme and its substrates.\n\
    \nIII. Functional Analysis\n1. Expression Patterns (e.g., spatiotemporal expression,\
    \ expression profiles)\n- Provide details on the gene’s spatiotemporal expression\
    \ patterns and expression profiles across tissues, developmental stages, and various\
    \ environments.\n2. Phenotypic Characteristics and Biological Functions (e.g.,\
    \ mutant phenotypes, associated traits)\n- Describe the phenotypic traits or characteristics\
    \ observed in mutants or variants of the gene.\n3. The underlying mechanism, pathways,\
    \ and networks\n- Explain the validated biological functions of the gene, including\
    \ any molecular interactions, pathways or networks involved.\n4. QTL Interactions\
    \  \n- Detail any interactions between the gene and quantitative trait loci (QTL),\
    \ if applicable.\n\nIV. Application and Evolutionary Analysis\n1. Domestication\
    \ Studies\n- Describe the gene’s role or significance in domestication studies,\
    \ if applicable.\n2. Applications (e.g., stress resistance, breeding)\n- Provide\
    \ information on practical applications of the gene, such as contributions to\
    \ stress resistance or breeding programs.\n3. Genetic diversity analysis or SNPs\
    \ analysis\n- Provide natural variations in promoter regions and gene-coding regions,\
    \ and further exhibit the genetic effects of these variations.\n\nReference Materials:\n\
    {{retrieve_results}}\n\nIn the search results I provide to you, each result is\
    \ formatted as [document X begin]...[document X end], where X represents the numerical\
    \ index of each article. Please cite the context at the end of the relevant sentence\
    \ when appropriate. Use the document format [document:X] in the corresponding\
    \ part of your answer. If a sentence is derived from multiple contexts, list all\
    \ relevant document numbers, such as [document:3][document:5]. Be sure not to\
    \ cluster all documents at the end; instead, include them in the corresponding\
    \ parts of the answer. For creative tasks (e.g., writing an essay), ensure that\
    \ references are cited within the body of the text, such as [document:3][document:5],\
    \ rather than only at the end of the text. You need to interpret and summarize\
    \ the user's requirements, choose an appropriate format, fully utilize the search\
    \ results, extract key information, and generate an answer that is insightful,\
    \ creative, and professional. Extend the length of your response as much as possible,\
    \ addressing each point in detail and from multiple perspectives, ensuring the\
    \ content is rich and thorough.\n\nPlease consolidate information for all listed\
    \ gene names (which represent aliases or variants of the same gene). Multiple\
    \ gene names are separated by the '|' symbol."
