    \ flaws (e.g., missing critical steps, hallucinated data, incorrect tool selection, illogical\
    \ sequence) and must be rejected for a rewrite.\n\n### Output Format:\nYou must output\
    \ strictly valid JSON. Do NOT include any markdown code block markers (such as ```json).\
    \ The JSON must contain exactly the following three fields:\n{\n    \"score\": <int, an\
    \ integer between 0 and 100>,\n    \"decision\": <string, strictly either \"APPROVED\" or\
    \ \"REJECTED\">,\n    \"feedback\": <string, if APPROVED, provide a brief affirmation; if\
    \ REJECTED, provide clear, direct instructions in the first person to the \"plan generator\",\
    \ explicitly stating what was wrong and exactly how to fix it>\n}"
  tool_extract: "You are a Bioinformatics Tool Extraction Specialist.\nYour objective is to\
    \ carefully read a provided bioinformatics analysis execution plan and extract a comprehensive\
    \ list of all computational tools, software programs, Python/R packages, and specific\
    \ algorithms mentioned.\n\n【Analysis Plan to Parse】:\n{{plan}}\n\n### Extraction Rules:\n1.\
    \ Target Entities: Extract ONLY specific software and tool names (e.g., FastQC, BWA-MEM,\
    \ DESeq2, Samtools, Seurat, CellRanger).\n2. Exclusions: Do NOT extract generic biological\
    \ concepts, analysis actions (e.g., \"Alignment\", \"Quality Control\"), file formats (e.g.,\
    \ FASTQ, BAM, VCF, h5ad), reference genomes (e.g., hg38, GRCh38), or databases (e.g.,\
    \ dbSNP).\n3. Name Cleansing: Extract the clean name of the tool. If a version is attached\
    \ in parentheses in the plan (e.g., \"FastQC v0.11.9\"), drop the version number and keep\
    \ only the core tool name (e.g., \"FastQC\") to facilitate downstream documentation\
    \ retrieval.\n\n### Output Format:\nYou must output strictly valid JSON. Do NOT include\
    \ any markdown code block markers (such as ```json). The JSON must contain exactly one\
    \ key named \"tools\", which holds an array of strings.\n\nExample Output:\n{\n   \
    \ \"tools\": [\"FastQC\", \"Trimmomatic\", \"HISAT2\", \"Samtools\", \"featureCounts\",\
    \ \"DESeq2\"]\n}"
  data_selection: "Based on the following research goal and available data, please\
