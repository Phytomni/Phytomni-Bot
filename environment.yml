---
name: phytomni-bot
channels:
  - conda-forge
  - defaults
dependencies:
  # Conda-forge pre-installs every runtime dependency listed in
  # [project.dependencies] that is reliably packaged on conda-forge.
  # The intent is to avoid pip building heavy / Rust / native wheels
  # (cryptography, onnxruntime, pydantic-core) against the host
  # toolchain when conda-forge already carries a known-good binary.
  # After `conda env create -f environment.yml`, run
  # `pip install -e ".[dev,demo]"` from the repo root to install the
  # editable mcp_server_phytomni / mcp_client_phytomni packages plus
  # the pip-only entries below and any transitive dependencies
  # (numpy / lxml / magika / etc. arrive through markitdown[all]).
  - python>=3.12,<3.15
  - cryptography>=42.0.0
  - fastapi>=0.115.0
  - httpx>=0.28.1
  - mcp>=1.27.0
  - onnxruntime>=1.25.1
  - openai>=2.36.0
  - pydantic>=2.13.4
  - pydantic-settings>=2.14.0
  - python-dotenv>=1.2.2
  - python-multipart>=0.0.9
  - pyyaml>=6.0.3
  - uvicorn>=0.34.0
  - pip

  # Pip-only packages: not reliably available on conda-forge with the
  # versions / features this project requires. `esdk-obs-python` is
  # the Huawei OBS SDK and ships only on PyPI; the langchain / langgraph
  # release cadence on conda-forge lags PyPI; `markitdown[all]` activates
  # extras that conda-forge does not expose as a single feed.
  - pip:
      - esdk-obs-python>=3.26.2
      - langchain-core>=1.3.3
      - langgraph>=1.1.10
      - markitdown[all]>=0.1.5
