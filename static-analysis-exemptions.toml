schema_version = 1

[policy]
default = "deny"

[[exemptions]]
id = "SAE-STR-0001"
tool = "pylint"
rule = "too-few-public-methods"
classification = "structural"
mechanism = "inline"
target_kind = "symbol"
path = "src/mcp_server_phytomni/common/http.py"
symbol = "AsyncRequestClient"
fingerprint = "sha256:5a0e264d2208fa111ebbb5a63bcd2a561210f8a9c7343df19f2be929589131ee"
owner = "bot-maintainers"
introduced_on = 2026-08-11
review_on = 2026-11-16
rationale = "The one-method request Protocol intentionally describes the narrow dependency used by retry helpers. 2026-08-16 specialist promote: keep structural; do not broaden the retry client."
counterfactual = "Replace the structural Protocol with a broader client abstraction."
risk = "A broadening of the retry helper contract could be hidden by this exemption."
tests = ["tests/unit/test_http_retries.py", "tests/unit/test_http_errors.py"]

[[exemptions]]
id = "SAE-STR-0002"
tool = "pylint"
rule = "too-many-ancestors"
classification = "structural"
mechanism = "inline"
target_kind = "symbol"
path = "src/mcp_server_phytomni/config/models/agents.py"
symbol = "DeepGenomeConfig"
fingerprint = "sha256:1c9a1090da72affd029ae135fe0dc870ae1964e7c743eaea171f02ec89442f1a"
owner = "bot-maintainers"
introduced_on = 2026-08-11
review_on = 2026-11-16
rationale = "DeepGenomeConfig intentionally composes the DataConfig and AnalystConfig field surfaces for existing agent consumers. 2026-08-16 specialist promote: keep structural; do not split the inheritance graph."
counterfactual = "Split the model into a new shared configuration base and migrate every consumer."
risk = "Changing the inheritance contract can alter Pydantic field and validator resolution."
tests = ["tests/unit/config/test_defaults.py", "tests/server/test_handler_support.py"]
