target_kind = "symbol"
path = "src/mcp_server_phytomni/agents/deep_genome/profile.py"
symbol = "DeepGenomeProfileMixin"
fingerprint = "sha256:f919078a50df4db511f41d14935848003d67ff934117be82f1f237cc9b4cf6f4"
owner = "bot-maintainers"
introduced_on = 2026-07-18
review_on = 2027-01-18
rationale = "The profile mixin keeps two graph-bound BI/cache helpers on the consuming agent."
counterfactual = "Extracting free functions would re-thread shared configuration and BI/cache context and weaken the profile boundary."
risk = "A future helper added without graph-state coupling could be incorrectly retained in this structural mixin."
tests = ["tests/agents/test_cache_candidates.py", "tests/agents/test_deep_genome_sql.py"]

