[project]
name = "mcp_server_phytomni"
version = "0.1.3"
description = "Phytomni MCP server, FastAPI HTTP API, and stdio CLI client packaging LangGraph agents for plant-science research workflows."
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "mcp",
    "langgraph",
    "agents",
    "plant-science",
    "bioinformatics",
    "phytomni",
    "fastapi",
    "http-api",
    "stdio-client",
    "cli",
]
authors = [
    {name = "Shang Xie", email = "xieshang0608@gmail.com"},
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "a2a-sdk[fastapi]>=1.1,<1.2",
    "asyncpg>=0.30.0",
    "cryptography>=42.0.0",
    "esdk-obs-python>=3.26.2",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain-core>=1.3.3",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langgraph>=1.2.0,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "markitdown[az-doc-intel,audio-transcription,docx,outlook,pdf,pptx,xls,xlsx]>=0.1.5",
    # The server and client target the MCP 1.x low-level API. Keep the
    # incompatible 2.x major out until its API migration is complete.
    "mcp>=1.27.0,<2",
    "onnxruntime>=1.25.1",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "sqlglot>=30.12,<31",
    "uvicorn[standard]>=0.34.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
phytomni = "mcp_client_phytomni.main:main"
phytomni-api = "mcp_server_phytomni.api.server:main"
phytomni-api-key = "mcp_server_phytomni.api.keys:main"
phytomni-cache = "mcp_server_phytomni.func_cache.cli:main"
phytomni-task-db = "mcp_server_phytomni.runtime.deep_genome_admin:main"

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mypy>=2.0.0",
    "pylint>=4.0.5",
    "pymarkdownlnt>=0.9.37",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12,<0.16",
    "shellcheck-py>=0.11.0",
    "toml-sort>=0.24.4",
    "types-protobuf<7",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.33.0",
    "validate-pyproject>=0.25",
    "yamllint>=1.38.0",
]
demo = [
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_phytomni", "src/mcp_client_phytomni"]

[tool.black]
line-length = 79
# Keep formatting on the lowest supported syntax target. Running Black on
# Python 3.12 cannot safely parse py313/py314 target output.
target-version = ["py312"]
exclude = '''
/(
    \.codex-tmp-review-debug
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
)/
'''

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]
exclude = [
    ".codex-tmp-review-debug",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
# Pin Ruff's historical default base rules to prevent version drift from
# silently expanding the enabled rule surface.
select = ["E4", "E7", "E9", "F"]
extend-select = ["I", "N", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_client_phytomni", "mcp_server_phytomni"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "typings"]
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "\\.codex-tmp-review-debug/",
    "\\.mypy_cache/",
    "\\.pytest_cache/",
    "\\.ruff_cache/",
    "\\.venv/",
]

[tool.pyright]
include = ["src"]
exclude = [
    "**/.codex-tmp-review-debug",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.venv",
]
pythonVersion = "3.12"
stubPath = "typings"
# Resolve imports against the uv-created .venv even when pyright runs bare
# (no active VIRTUAL_ENV). The gate's ``uv run pyright`` already exports it,
# but a direct ``pyright src scripts`` would otherwise emit spurious
# reportMissingImports for every third-party package.
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-m",
    "not integration and not network",
]
markers = [
    "unit: fast offline unit tests.",
    "server: MCP server schema and dispatch tests.",
    "agent: offline agent smoke tests with mocked external services.",
    "integration: tests that may require configured external services.",
    "network: tests that may perform real network, OBS, or LLM calls.",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["mcp_server_phytomni", "mcp_client_phytomni"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.pylint.main]
py-version = "3.12"
# Keep repository-local test and script packages importable in focused runs.
init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint."messages control"]

[tool.pylint.design]

[tool.pylint.similarities]

[tool.pymarkdown.plugins.md024]
# CHANGELOG.md repeats ``### Added`` / ``### Changed`` per version block;
# siblings_only allows repeats under different parents while still catching
# true in-section duplicates.
siblings_only = true

[tool.tomlsort]
# TOML gate config (consumed by `toml-sort --check` and the in-place
# formatter; CLI flags are not used so local and CI share one config).
# Preserve the project's deliberate table ordering — alphabetizing
# [tool.*] would scramble the [build-system]/[project]/[tool.*] grouping
# this repo and most pyprojects expect.
no_sort_tables = true
# Keep 4-space indentation in multiline arrays (the repo's existing
# convention for the dev / classifiers / exclude lists).
spaces_indent_inline_array = 4
# Preserve the trailing comma on the last item in multiline arrays:
# adding a new dep then does not modify the prior line, which keeps
# code-review diffs small under heavy multi-agent churn.
trailing_comma_inline_array = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
