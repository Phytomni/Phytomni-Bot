[project]
name = "mcp_server_phytomni"
version = "0.1.3"
description = "Phytomni MCP server, FastAPI HTTP API, and stdio CLI client packaging LangGraph agents for plant-science research workflows."
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "mcp",
    "langgraph",
    "agents",
    "plant-science",
    "bioinformatics",
    "phytomni",
    "fastapi",
    "http-api",
    "stdio-client",
    "cli",
]
authors = [
    {name = "Shang Xie", email = "xieshang0608@gmail.com"},
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "a2a-sdk[fastapi]>=1.1,<1.2",
    "asyncpg>=0.30.0",
    "cryptography>=42.0.0",
    "esdk-obs-python>=3.26.2",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain-core>=1.3.3",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langgraph>=1.2.0,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "markitdown[all]>=0.1.5",
    "mcp>=1.27.0",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "sqlglot>=30.12,<31",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
phytomni = "mcp_client_phytomni.main:main"
phytomni-api = "mcp_server_phytomni.api.server:main"
phytomni-api-key = "mcp_server_phytomni.api.keys:main"
phytomni-cache = "mcp_server_phytomni.func_cache.cli:main"
phytomni-task-db = "mcp_server_phytomni.runtime.deep_genome_admin:main"

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mypy>=2.0.0",
    "pylint>=4.0.5",
    "pymarkdownlnt>=0.9.37",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "shellcheck-py>=0.11.0",
    "toml-sort>=0.24.4",
    "types-protobuf<7",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.33.0",
    "validate-pyproject>=0.25",
    "yamllint>=1.38.0",
]
demo = [
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_phytomni", "src/mcp_client_phytomni"]

[tool.black]
line-length = 79
# Keep formatting on the lowest supported syntax target. Running Black on
# Python 3.12 cannot safely parse py313/py314 target output.
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
)/
'''

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
# ASYNC109 is handled by exact function-local ``noqa`` records. The
# approved functions forward a transport budget to a downstream client;
# they do not own the cancellation scope for that request.
extend-select = ["I", "N", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typings/*.pyi files mirror external SDKs (e.g. esdk-obs-python) whose
# public API is camelCase. Renaming would break the type-check
# correspondence, so the PEP 8 naming rules N802 (function names),
# N803 (argument names), and N815 (mixedCase class attributes) do not
# apply to stubs. Keep these stubs in ruff's scope for I-import-sort
# and other structural checks.
"typings/**/*.pyi" = ["N802", "N803", "N815"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_client_phytomni", "mcp_server_phytomni"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "typings"]
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "\\.mypy_cache/",
    "\\.pytest_cache/",
    "\\.ruff_cache/",
    "\\.venv/",
]

# asyncpg ships no type stubs or py.typed marker; pyright resolves it
# through bundled stubs, but mypy needs an explicit override.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# The demo fixture generator (demo_data/scripts/) is outside the full
# gate's mypy scope (src tests e2e scripts) but the scoped gate type
# checks it when it changes; openpyxl + reportlab ship no type stubs.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
exclude = [
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.venv",
]
pythonVersion = "3.12"
stubPath = "typings"
# Resolve imports against the uv-created .venv even when pyright runs bare
# (no active VIRTUAL_ENV). The gate's ``uv run pyright`` already exports it,
# but a direct ``pyright src scripts`` would otherwise emit spurious
# reportMissingImports for every third-party package.
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-m",
    "not integration and not network",
]
markers = [
    "unit: fast offline unit tests.",
    "server: MCP server schema and dispatch tests.",
    "agent: offline agent smoke tests with mocked external services.",
    "integration: tests that may require configured external services.",
    "network: tests that may perform real network, OBS, or LLM calls.",
]
filterwarnings = [
    "error",
    # Third-party obs SDK triggers this at import time
    # (obs/client.py:376), outside this repo's control.
    "ignore:ssl.PROTOCOL_TLS is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["mcp_server_phytomni", "mcp_client_phytomni"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.pylint.main]
py-version = "3.12"
# typings/ holds .pyi stubs that mirror external SDKs (e.g.
# esdk-obs-python). The stubs have no bodies, so W0613
# (unused-argument), C0116 (missing-function-docstring), and R0903
# (too-few-public-methods) fire spuriously; and C0103 (invalid-name)
# / R0913 / R0917 trip on the camelCase signatures that must mirror
# upstream exactly. mypy and pyright are the canonical stub checkers
# (validated by ``stubPath = "typings"`` in [tool.pyright]) so
# The OBS stub carries a file-local rule set for the six signature/docstring
# diagnostics above; ordinary tool/cache directories remain excluded here.
ignore = [".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv"]

[tool.pylint."messages control"]

[tool.pylint.design]

[tool.pylint.similarities]

[tool.pymarkdown]
# MD013 (line-length): mdformat runs with ``--wrap keep`` and never
# reflows prose or tables, so a fixed-width line rule is structurally
# unsatisfiable — the two markdown tools would disagree on the same
# line. mdformat is the sole authority on markdown line shape here,
# mirroring how [tool.black] / [tool.ruff] own Python line shape.
# See docs/development/lint-exemptions.md for the full rationale.
plugins.md013.enabled = false
# MD024 (no-duplicate-heading): CHANGELOG.md repeats ``### Added`` /
# ``### Changed`` per version block; siblings_only allows repeats under
# different parents while still catching true in-section duplicates.
plugins.md024.siblings_only = true

[tool.tomlsort]
# TOML gate config (consumed by `toml-sort --check` and the in-place
# formatter; CLI flags are not used so local and CI share one config).
# Preserve the project's deliberate table ordering — alphabetizing
# [tool.*] would scramble the [build-system]/[project]/[tool.*] grouping
# this repo and most pyprojects expect.
no_sort_tables = true
# Keep 4-space indentation in multiline arrays (the repo's existing
# convention for the dev / classifiers / exclude lists).
spaces_indent_inline_array = 4
# Preserve the trailing comma on the last item in multiline arrays:
# adding a new dep then does not modify the prior line, which keeps
# code-review diffs small under heavy multi-agent churn.
trailing_comma_inline_array = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
