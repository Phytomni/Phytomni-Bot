[project]
name = "mcp_server_phytomni"
version = "0.1.0"
description = "MCP server providing LangGraph agents for plant-science research workflows."
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "mcp",
    "langgraph",
    "agents",
    "plant-science",
    "bioinformatics",
    "phytomni",
]
authors = [
    { name = "Shang Xie", email = "xieshang0608@gmail.com" }
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "esdk-obs-python>=3.26.2",
    "httpx>=0.28.1",
    "langchain-core>=1.3.3",
    "langgraph>=1.1.10",
    "markitdown[all]>=0.1.5",
    "mcp>=1.27.0",
    "onnxruntime>=1.25.1",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mypy>=2.0.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260503",
    "yamllint>=1.38.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mypy>=2.0.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260503",
    "yamllint>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_phytomni", "src/mcp_client_phytomni"]

[tool.black]
line-length = 79
# Keep formatting on the lowest supported syntax target. Running Black on
# Python 3.12 cannot safely parse py313/py314 target output.
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
)/
'''

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
extend-select = ["I", "N"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_client_phytomni", "mcp_server_phytomni"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "typings"]
exclude = [
    "\\.mypy_cache/",
    "\\.pytest_cache/",
    "\\.ruff_cache/",
    "\\.venv/",
]

[tool.pyright]
include = ["src"]
exclude = [
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.venv",
]
pythonVersion = "3.12"
stubPath = "typings"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-m",
    "not integration and not network",
]
markers = [
    "unit: fast offline unit tests.",
    "server: MCP server schema and dispatch tests.",
    "agent: offline agent smoke tests with mocked external services.",
    "integration: tests that may require configured external services.",
    "network: tests that may perform real network, OBS, or LLM calls.",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["mcp_server_phytomni"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.pylint.main]
py-version = "3.12"
ignore = [".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
