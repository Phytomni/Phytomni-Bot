[project]
name = "mcp_server_phytomni"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shang Xie", email = "xieshang0608@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "esdk-obs-python>=3.26.2",
    "httpx>=0.28.1",
    "langchain-core>=1.3.2",
    "langgraph>=1.1.10",
    "markitdown[all]>=0.1.5",
    "mcp>=1.27.0",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mypy>=1.20.2",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.33.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mypy>=1.20.2",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]

[tool.ruff.lint]
extend-select = ["I", "N"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_server_phytomni"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "typings"]
exclude = [
    "\\.mypy_cache/",
    "\\.pytest_cache/",
    "\\.ruff_cache/",
    "\\.venv/",
]

[tool.pyright]
include = ["src"]
exclude = [
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.venv",
]
pythonVersion = "3.12"
stubPath = "typings"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-m",
    "not integration and not network",
]
markers = [
    "unit: fast offline unit tests.",
    "server: MCP server schema and dispatch tests.",
    "agent: offline agent smoke tests with mocked external services.",
    "integration: tests that may require configured external services.",
    "network: tests that may perform real network, OBS, or LLM calls.",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["mcp_server_phytomni"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.pylint.main]
py-version = "3.12"
ignore = [".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv"]

[tool.pylint.messages_control]
disable = [
    # Stage 7.10 reviewed: only legacy duplication/complexity categories
    # remain global. New lint waivers must be local and documented.
    "duplicate-code",
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
]
