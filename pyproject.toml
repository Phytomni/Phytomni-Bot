[project]
name = "mcp_server_phytomni"
version = "0.1.0"
description = "Phytomni MCP server, FastAPI HTTP API, and stdio CLI client packaging LangGraph agents for plant-science research workflows."
readme = "README.md"
license = {file = "LICENSE"}
keywords = [
    "mcp",
    "langgraph",
    "agents",
    "plant-science",
    "bioinformatics",
    "phytomni",
    "fastapi",
    "http-api",
    "stdio-client",
    "cli",
]
authors = [
    {name = "Shang Xie", email = "xieshang0608@gmail.com"},
]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "cryptography>=42.0.0",
    "esdk-obs-python>=3.26.2",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain-core>=1.3.3",
    "langgraph>=1.1.10",
    "markitdown[all]>=0.1.5",
    "mcp>=1.27.0",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
phytomni = "mcp_client_phytomni.main:main"
phytomni-api = "mcp_server_phytomni.api.server:main"
phytomni-api-key = "mcp_server_phytomni.api.keys:main"
phytomni-cache = "mcp_server_phytomni.func_cache.cli:main"

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mypy>=2.0.0",
    "pylint>=4.0.5",
    "pymarkdownlnt>=0.9.37",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "shellcheck-py>=0.11.0",
    "toml-sort>=0.24.4",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.33.0",
    "validate-pyproject>=0.25",
    "yamllint>=1.38.0",
]
demo = [
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mypy>=2.0.0",
    "pylint>=4.0.5",
    "pymarkdownlnt>=0.9.37",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "shellcheck-py>=0.11.0",
    "toml-sort>=0.24.4",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.33.0",
    "validate-pyproject>=0.25",
    "yamllint>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_phytomni", "src/mcp_client_phytomni"]

[tool.black]
line-length = 79
# Keep formatting on the lowest supported syntax target. Running Black on
# Python 3.12 cannot safely parse py313/py314 target output.
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
)/
'''

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    # typings/ holds type stubs (camelCase external SDK signatures);
    # mypy and pyright are the canonical stub checkers, so ruff's
    # PEP 8 naming/style rules do not apply here.
    "typings",
]

[tool.ruff.lint]
extend-select = ["I", "N"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_client_phytomni", "mcp_server_phytomni"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "typings"]
exclude = [
    "\\.mypy_cache/",
    "\\.pytest_cache/",
    "\\.ruff_cache/",
    "\\.venv/",
]

[tool.pyright]
include = ["src"]
exclude = [
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.venv",
]
pythonVersion = "3.12"
stubPath = "typings"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "-m",
    "not integration and not network",
]
markers = [
    "unit: fast offline unit tests.",
    "server: MCP server schema and dispatch tests.",
    "agent: offline agent smoke tests with mocked external services.",
    "integration: tests that may require configured external services.",
    "network: tests that may perform real network, OBS, or LLM calls.",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["mcp_server_phytomni", "mcp_client_phytomni"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.pylint.main]
py-version = "3.12"
# typings/ holds type stubs that mirror external SDKs' camelCase APIs and
# have no method bodies; mypy and pyright are the canonical stub checkers
# (no rule conflicts there), so the stubs sit outside pylint's scope.
ignore = [".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "typings"]

[tool.pylint."messages control"]
# W0135 contextmanager-generator-missing-cleanup is a documented false
# positive on the canonical `@asynccontextmanager` + `async with X() as y:
# yield y` pattern when the inner context manager is referenced through a
# closure variable instead of an inline external class (production
# common.httpx_client.get_async_client passes; tests.conftest's
# scripted-client factory cannot). The decorator already converts a thrown
# GeneratorExit into the proper `__aexit__` call, so the warning never
# matches real cleanup bugs in this codebase.
disable = ["contextmanager-generator-missing-cleanup"]

[tool.pylint.design]
# Cache-key primitives (e.g. agents/knowledge/retrieval.py
# _retrieve_scope_docs, _rerank_batch, agents/chat/service.py
# run_phyto_chat_cached) deliberately expose every semantic input
# as a top-level scalar parameter so the @func_cache key_params list
# hashes only the real query inputs — wrapping them back into an
# options object would re-introduce the infra-leaks-into-key bug the
# rework removed. The default R0913 / R0914 / R0917 thresholds are
# too tight for that pattern, so bump them project-wide.
max-args = 15
max-locals = 20
max-module-lines = 1200
max-positional-arguments = 15
# Test fakes (camelCase SDK proxies, protocol-only stubs, NamedTuple
# helpers) routinely have a single public surface — usually just an
# `__init__` plus `__getattr__` — and tripping R0903 there pushes
# authors toward inline disables. Lowering the floor by one keeps the
# fakes terse without weakening the rule for production code.
min-public-methods = 1

[tool.pymarkdown]
# Markdown gate config (consumed via `pymarkdown --config pyproject.toml`).
# MD013 (line-length): mdformat runs with `--wrap keep` and never reflows
# prose/tables, so a fixed-width line rule is structurally unsatisfiable —
# mdformat is the sole authority on Markdown line shape, mirroring how
# [tool.ruff]/[tool.black] own Python line shape here.
plugins.md013.enabled = false
# MD024 (duplicate headings): README intentionally reuses section names
# under different parents (e.g. install-troubleshooting "Configuration" vs
# the top-level "Configuration" section); siblings_only keeps the rule on
# for genuine same-parent duplicates without forcing degraded headings.
plugins.md024.siblings_only = true

[tool.tomlsort]
# TOML gate config (consumed by `toml-sort --check` and the in-place
# formatter; CLI flags are not used so local and CI share one config).
# Preserve the project's deliberate table ordering — alphabetizing
# [tool.*] would scramble the [build-system]/[project]/[tool.*] grouping
# this repo and most pyprojects expect.
no_sort_tables = true
# Keep 4-space indentation in multiline arrays (the repo's existing
# convention for the dev / classifiers / exclude lists).
spaces_indent_inline_array = 4
# Preserve the trailing comma on the last item in multiline arrays:
# adding a new dep then does not modify the prior line, which keeps
# code-review diffs small under heavy multi-agent churn.
trailing_comma_inline_array = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
