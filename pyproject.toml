[project]
name = "mcp_server_phytomni"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shang Xie", email = "xieshang0608@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "esdk-obs-python>=3.26.2",
    "httpx>=0.28.1",
    "langchain-core>=1.3.2",
    "langgraph>=1.1.10",
    "markitdown[all]>=0.1.5",
    "mcp>=1.27.0",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "ipykernel>=7.2.0",
    "mypy>=1.20.2",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79
