---
name: Lint

"on": [push, pull_request]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check commit message style
        run: >-
          python3 scripts/validate_commit_messages.py
          --github-event "$GITHUB_EVENT_PATH"
      - name: Scan tracked content for secrets
        run: python3 scripts/scan_secrets.py --all
      - name: Compile Python sources
        run: python -m compileall src tests e2e scripts
      - name: Check committed whitespace
        run: git diff-tree --check --no-commit-id --root -r HEAD

  dependency-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimum direct dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libcairo2-dev
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system --resolution lowest-direct -e ".[dev,demo]"
      - name: Check the minimum dependency environment
        run: uv pip check --system
      - name: Run offline tests at dependency floors
        env:
          PHYTOMNI_TESTING: "1"
          PHYTOMNI_DEPENDENCY_FLOOR: "1"
          DOMAIN_NAME: pytest-domain
          USER_NAME: pytest-user
          USER_PASSWORD: pytest-password
          ACCESS_KEY_ID: pytest-access-key-id
          SECRET_ACCESS_KEY: pytest-secret-access-key
          BASE_URL: https://example.invalid/llm
          MODEL_ID: pytest-model
          API_KEY: pytest-api-key
          CODER_URL: https://example.invalid/coder
          CODER_MODEL: pytest-coder-model
          CODER_API_KEY: pytest-coder-api-key
          EMBED_URL: https://example.invalid/embed
          EMBED_MODEL: pytest-embed-model
          EMBED_API_KEY: pytest-embed-api-key
          GAUSS_DSN: postgresql://pytest:pytest@localhost:5432/pytest
        # The lowest direct MarkItDown dependency currently imports an
        # openpyxl path that emits this upstream deprecation warning.
        run: >-
          pytest
          -W 'ignore:datetime.datetime.utcnow:DeprecationWarning'

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Check code formatting with black
        run: black --check .

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Lint with ruff
        run: ruff check --config pyproject.toml .

  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Lint with flake8
        run: flake8 src tests e2e scripts

  mypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Type check with mypy
        run: |
          mypy --python-version ${{ matrix.python-version }} \
            src tests e2e scripts

  pyright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Type check with pyright
        run: pyright --pythonversion ${{ matrix.python-version }} src scripts

  pylint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev,demo]"
      - name: Analyse code and exact exemptions with pylint
        run: >-
          uv run --extra dev --extra demo python
          scripts/check_static_analysis_exemptions.py
          check-pylint
          --python-version "${{ matrix.python-version }}"
          --files-from-git

  static-exemptions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static-analysis policy dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev,demo]"
      - name: Check static-analysis registry
        run: >-
          uv run --extra dev python
          scripts/check_static_analysis_exemptions.py
          check --scope full
      - name: Check generated static-analysis ledger
        run: >-
          uv run --extra dev python
          scripts/check_static_analysis_exemptions.py
          render-docs --check

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Run offline tests with coverage
        env:
          # Several agents/* modules call SensitiveConfig.load() at
          # module-import time, so pytest collection imports the
          # package before tests/conftest.py can populate os.environ.
          # CI has no .env file; mirror tests/conftest.py:_TEST_ENV
          # here so the import-time validation succeeds and
          # PHYTOMNI_TESTING short-circuits load_env_file() before
          # pydantic runs.
          PHYTOMNI_TESTING: "1"
          DOMAIN_NAME: pytest-domain
          USER_NAME: pytest-user
          USER_PASSWORD: pytest-password
          ACCESS_KEY_ID: pytest-access-key-id
          SECRET_ACCESS_KEY: pytest-secret-access-key
          BASE_URL: https://example.invalid/llm
          MODEL_ID: pytest-model
          API_KEY: pytest-api-key
          CODER_URL: https://example.invalid/coder
          CODER_MODEL: pytest-coder-model
          CODER_API_KEY: pytest-coder-api-key
          EMBED_URL: https://example.invalid/embed
          EMBED_MODEL: pytest-embed-model
          EMBED_API_KEY: pytest-embed-api-key
          GAUSS_DSN: postgresql://pytest:pytest@localhost:5432/pytest
        run: |
          pytest \
            --cov=mcp_server_phytomni \
            --cov=mcp_client_phytomni \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=json:coverage.json
          python scripts/check_module_coverage.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Lint YAML files with yamllint
        run: yamllint .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Lint workflows with actionlint
        run: |
          git ls-files -z '.github/workflows/*' \
            | xargs -0 -r scripts/actionlint_runner.sh

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Check Markdown formatting with mdformat
        run: |
          git ls-files -z '*.md' ':!:demo_data/' \
            | xargs -0 -r mdformat --check
      - name: Lint Markdown with pymarkdown
        run: |
          git ls-files -z '*.md' ':!:demo_data/' \
            | xargs -0 -r pymarkdown --config pyproject.toml scan

  toml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Check TOML formatting with toml-sort
        run: |
          git ls-files -z '*.toml' \
            | xargs -0 -r toml-sort --check
      - name: Validate pyproject.toml schemas
        run: |
          git ls-files -z '*pyproject.toml' \
            | xargs -0 -r validate-pyproject

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev]"
      - name: Lint shell scripts with shellcheck
        run: |
          git ls-files -z '*.sh' .githooks | xargs -0 -r shellcheck
      - name: Format-check shell scripts with shfmt
        run: |
          git ls-files -z '*.sh' .githooks \
            | xargs -0 -r scripts/shfmt_runner.sh -d -i 4

  jsonlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install jsonlint
        run: npm install --global jsonlint
      - name: Lint JSON files with jsonlint
        run: |
          git ls-files '*.json' | while IFS= read -r file; do
            jsonlint "$file" --quiet
          done

  json-normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check config JSON normalization with normalize_json.py
        run: python scripts/normalize_json.py --check
