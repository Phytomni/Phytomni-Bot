---
name: Secret Scan

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked files
        run: python scripts/scan_secrets.py --all

      - name: Scan pushed commit diff
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [ "$BEFORE" = "$zero_sha" ]; then
            echo "No previous commit; tracked-file scan already ran."
          elif git cat-file -e "$BEFORE^{commit}"; then
            python scripts/scan_secrets.py --git-range "$BEFORE..$SHA"
          else
            echo "Previous commit unavailable; tracked-file scan already ran."
          fi

      - name: Scan pull request commit diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git cat-file -e "$BASE^{commit}" &&
             git cat-file -e "$HEAD_SHA^{commit}"; then
            python scripts/scan_secrets.py --git-range "$BASE..$HEAD_SHA"
          elif git cat-file -e "$BASE^{commit}"; then
            python scripts/scan_secrets.py --git-range "$BASE..HEAD"
          else
            echo "Base commit unavailable; tracked-file scan already ran."
          fi
